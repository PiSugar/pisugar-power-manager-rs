name: build-web

on:
  workflow_call:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Nodejs
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      # Install the dependency versions recorded in yarn.lock.
      - name: Build web
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn build
        working-directory: pisugar-webui

      # Upload artifact
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pisugar-web
          path: |
            pisugar-webui/dist
          if-no-files-found: warn
