name: Release QiNiu

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to refresh and verify
        required: true
        default: v2.4.0
        type: string

jobs:
  upload-qiniu:
    name: "Upload to QiNiu"
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: "Upload to QiNiu"
        env:
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir release
          cd release

          if [ $(uname -m) == 'x86_64' ]; then
            wget https://github.com/qiniu/qshell/releases/download/v2.16.1/qshell-v2.16.1-linux-amd64.tar.gz
            tar -xvf qshell-v2.16.1-linux-amd64.tar.gz
          else
            wget https://github.com/qiniu/qshell/releases/download/v2.16.1/qshell-v2.16.1-linux-386.tar.gz
            tar -xvf qshell-v2.16.1-linux-386.tar.gz
          fi
          chmod +x qshell
          ./qshell account -w ${QINIU_AK} ${QINIU_SK} deploy-account

          sudo apt-get install -y jq
          # Publish exactly the assets from this release event, not /releases/latest.
          jq -r '.release.assets[].browser_download_url' "$GITHUB_EVENT_PATH" > urls
          while IFS= read -r url; do
            filename=${url##*/}
            wget -O "$filename" "$url"
          done < urls

          # The installer must come from the same build as the packages.
          tar -xzf scripts.tar.gz scripts/pisugar-power-manager.sh
          installer=scripts/pisugar-power-manager.sh
          version=$(sed -n 's/^version=//p' "$installer")
          tag=$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")
          test "v$version" = "$tag"
          for package in server poweroff programmer; do
            test -s "pisugar-${package}_${version}-1_arm64.deb"
          done

          # Upload packages first; any failed upload must fail the job.
          while IFS= read -r url; do
            filename=${url##*/}
            ./qshell rput --overwrite --mimetype application/octet-stream "$QINIU_BUCKET" "release/$filename" "$filename"
          done < urls
          ./qshell rput --overwrite --mimetype text/plain "$QINIU_BUCKET" release/pisugar-power-manager.sh "$installer"

          bash ../scripts/verify-release-cdn.sh "$version" "$installer"

  refresh-cdn:
    name: Refresh and verify published CDN assets
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refresh CDN and verify exact release contents
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${RELEASE_TAG#v}
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release-info.json
          jq -e '.isDraft == false and .isPrerelease == false' release-info.json
          mkdir release
          cd release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern scripts.tar.gz --pattern "pisugar-*_${version}-1_arm64.deb"
          tar -xzf scripts.tar.gz scripts/pisugar-power-manager.sh
          test "$(sed -n 's/^version=//p' scripts/pisugar-power-manager.sh)" = "$version"
          curl --fail --silent --show-error --location https://github.com/qiniu/qshell/releases/download/v2.16.1/qshell-v2.16.1-linux-amd64.tar.gz -o qshell.tar.gz
          tar -xzf qshell.tar.gz
          chmod +x qshell
          ./qshell account -w "$QINIU_AK" "$QINIU_SK" deploy-account
          bash ../scripts/verify-release-cdn.sh "$version" scripts/pisugar-power-manager.sh
