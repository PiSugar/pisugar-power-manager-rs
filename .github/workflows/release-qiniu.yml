name: Release QiNiu

on:
  release:
    types: [published]

jobs:
  upload-qiniu:
    name: "Upload to QiNiu"
    if: ${{ !github.event.release.prerelease }}
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: "Upload to QiNiu"
        env:
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir release
          cd release

          if [ $(uname -m) == 'x86_64' ]; then
            wget https://github.com/qiniu/qshell/releases/download/v2.16.1/qshell-v2.16.1-linux-amd64.tar.gz
            tar -xvf qshell-v2.16.1-linux-amd64.tar.gz
          else
            wget https://github.com/qiniu/qshell/releases/download/v2.16.1/qshell-v2.16.1-linux-386.tar.gz
            tar -xvf qshell-v2.16.1-linux-386.tar.gz
          fi
          chmod +x qshell
          ./qshell account -w ${QINIU_AK} ${QINIU_SK} deploy-account

          sudo apt-get install -y jq
          # Publish exactly the assets from this release event, not /releases/latest.
          jq -r '.release.assets[].browser_download_url' "$GITHUB_EVENT_PATH" > urls
          while IFS= read -r url; do
            filename=${url##*/}
            wget -O "$filename" "$url"
          done < urls

          # The installer must come from the same build as the packages.
          tar -xzf scripts.tar.gz scripts/pisugar-power-manager.sh
          installer=scripts/pisugar-power-manager.sh
          version=$(sed -n 's/^version=//p' "$installer")
          tag=$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")
          test "v$version" = "$tag"
          for package in server poweroff programmer; do
            test -s "pisugar-${package}_${version}-1_arm64.deb"
          done

          # Upload packages first; any failed upload must fail the job.
          while IFS= read -r url; do
            filename=${url##*/}
            ./qshell rput --overwrite --mimetype application/octet-stream "$QINIU_BUCKET" "release/$filename" "$filename"
          done < urls
          ./qshell rput --overwrite --mimetype text/plain "$QINIU_BUCKET" release/pisugar-power-manager.sh "$installer"

          # Detect stale CDN caches as a deployment failure requiring refresh.
          curl --fail --silent --show-error https://cdn.pisugar.com/release/pisugar-power-manager.sh -o served-installer
          cmp "$installer" served-installer
          for package in server poweroff programmer; do
            filename="pisugar-${package}_${version}-1_arm64.deb"
            curl --fail --silent --show-error "https://cdn.pisugar.com/release/$filename" -o served-package
            cmp "$filename" served-package
          done
          echo "Release installer and ARM64 packages verified through CDN"
