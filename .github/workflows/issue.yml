name: Close inactive issues

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark and close inactive issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >-
            This issue is stale because it has been open for 30 days with no
            activity. Please add an update if the issue is still relevant.
          close-issue-message: >-
            This issue was closed because it has been inactive for 14 days
            since being marked as stale. Please open a new issue with current
            version and reproduction details if the problem still occurs.
          days-before-pr-stale: -1
          days-before-pr-close: -1
