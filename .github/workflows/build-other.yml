name: build-other

on:
  workflow_call:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Linux module
      - run: tar -czvf pisugar-module.tar.gz pisugar-module

      # Upload artifact
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pisugar-other
          path: |
            pisugar-module.tar.gz
          if-no-files-found: warn

  kernel-modules:
    name: Kernel modules (${{ matrix.arch }}, ${{ matrix.suite }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            image: debian:bookworm
            suite: bookworm
            headers: linux-headers-rpi-v8 linux-headers-rpi-2712
          - arch: armhf
            platform: linux/arm/v7
            image: arm32v7/debian:bookworm
            suite: bookworm
            headers: linux-headers-rpi-v6 linux-headers-rpi-v7 linux-headers-rpi-v7l
          - arch: arm64
            platform: linux/arm64
            image: debian:trixie
            suite: trixie
            headers: linux-headers-rpi-v8 linux-headers-rpi-2712
          - arch: armhf
            platform: linux/arm/v7
            image: arm32v7/debian:trixie
            suite: trixie
            headers: linux-headers-rpi-v6 linux-headers-rpi-v7 linux-headers-rpi-v7l
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable 32-bit ARM containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build against Raspberry Pi OS kernel headers
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          SUITE: ${{ matrix.suite }}
          HEADERS: ${{ matrix.headers }}
          MODULE_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e SUITE -e HEADERS -e MODULE_ARCH \
            -v "$PWD:/work" -w /work "$IMAGE" bash -euxo pipefail -c '
              apt-get -o Acquire::Retries=5 update
              apt-get -o Acquire::Retries=5 install -y --no-install-recommends ca-certificates curl gpg gpgv build-essential bc bison flex libssl-dev libelf-dev kmod
              curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key | gpg --dearmor -o /usr/share/keyrings/raspberrypi-archive-keyring.gpg
              curl -fsSL "https://archive.raspberrypi.com/debian/dists/$SUITE/InRelease" -o /tmp/raspberrypi.InRelease
              gpgv --keyring /usr/share/keyrings/raspberrypi-archive-keyring.gpg /tmp/raspberrypi.InRelease
              # Trixie rejects the archive key legacy SHA-1 binding when APT
              # invokes sqv. Verify the official signed index above with gpgv,
              # then consume that verified repository in this ephemeral image.
              echo "deb [trusted=yes] https://archive.raspberrypi.com/debian/ $SUITE main" > /etc/apt/sources.list.d/raspberrypi.list
              apt-get -o Acquire::Retries=5 update
              available=""
              for package in $HEADERS; do
                if apt-cache show "$package" >/dev/null 2>&1; then available="$available $package"; fi
              done
              if [ -z "$available" ]; then available=raspberrypi-kernel-headers; fi
              apt-get -o Acquire::Retries=5 install -y --no-install-recommends $available
              bash pisugar-module/build-prebuilt.sh "$MODULE_ARCH" dist
            '

      - name: Upload prebuilt modules
        uses: actions/upload-artifact@v4
        with:
          name: pisugar-modules-${{ matrix.arch }}-${{ matrix.suite }}
          path: dist/*.tar.gz
          if-no-files-found: error
